<script>
  /* ==========================================================================
     POULTRY WORKSPACE LOGIC
     ========================================================================== */
  function buildPoultryRegionMapping() {
    poultryRegionMap = {};
    if (!poultryData || !poultryData.rows) return;

    let currentRegion = '';
    poultryData.rows.forEach(r => {
      if (r.level.toLowerCase().includes('region')) {
        currentRegion = r.name;
        if (!poultryRegionMap[currentRegion]) poultryRegionMap[currentRegion] = [];
      } else if (r.level.toLowerCase().includes('prov') && currentRegion) {
        if (!poultryRegionMap[currentRegion].includes(r.name)) {
          poultryRegionMap[currentRegion].push(r.name);
        }
      }
    });
  }

  function populatePoultryFilters() {
    if (!poultryData || !poultryData.rows) return;
    
    const ptTypes = [...new Set(poultryData.rows.map(r => r.commodity))].filter(Boolean);
    const ptYears = [...new Set(poultryData.timeColumns.map(tc => tc.year))].filter(Boolean);
    const ptRegions = [...new Set(poultryData.rows
      .filter(r => r.level.toLowerCase().includes('region'))
      .map(r => r.name))].filter(Boolean);

    addOptions('ptTypeFilter', ptTypes);
    addOptions('ptYearFilter', ptYears);
    addOptions('ptRegionFilter', ptRegions);

    addOptions('ptChart1Type', ptTypes);

    addOptions('ptChart2Type', ptTypes);
    addOptions('ptChart2Region', ptRegions);

    addOptions('ptChart3Type', ptTypes);
    addOptions('ptChart3Region', ptRegions);

    addOptions('ptMatrixType', ptTypes);
    addOptions('ptMatrixYear', ptYears);
    addOptions('ptMatrixRegion', ptRegions);

    selectDefaultValue('ptTypeFilter', 'Chicken');
    document.getElementById('ptPeriodFilter').value = 'Annual';
    document.getElementById('ptRegionFilter').value = 'ALL';

    selectDefaultValue('ptChart1Type', 'Chicken');
    selectDefaultValue('ptChart2Type', 'Chicken');
    selectDefaultValue('ptChart3Type', 'Chicken');
    selectDefaultValue('ptMatrixType', 'Chicken');

    setupPoultryEventListeners();
  }

  function setupPoultryEventListeners() {
    ['ptTypeFilter', 'ptPeriodFilter', 'ptYearFilter', 'ptRegionFilter'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onchange = updatePoultryPage;
    });

    ['ptChart1Type', 'ptChart1Period'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onchange = renderPoultryVolumeChart;
    });

    ['ptChart2Type', 'ptChart2Region'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onchange = renderPoultryShareChart;
    });

    ['ptChart3Type', 'ptChart3Region'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onchange = renderPoultryProvincialChart;
    });

    ['ptMatrixType', 'ptMatrixPeriod', 'ptMatrixYear', 'ptMatrixRegion'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onchange = renderPoultryMatrixTable;
    });
  }

  function updatePoultryPage() {
    if (!poultryData || !poultryData.rows || poultryData.rows.length === 0) {
      fetchPoultryData();
      return;
    }

    const typeFilter = document.getElementById('ptTypeFilter').value;
    const periodFilter = document.getElementById('ptPeriodFilter').value;
    const yearFilter = document.getElementById('ptYearFilter').value;
    const regionFilter = document.getElementById('ptRegionFilter').value;

    let targetRows = poultryData.rows.filter(r => {
      const commStr = (r.commodity || '').toLowerCase();
      const matchesType = typeFilter === 'ALL' || commStr.includes(typeFilter.toLowerCase());
      const locStr = (r.name || '').toLowerCase();
      const matchesRegion = regionFilter === 'ALL' || locStr.includes(regionFilter.toLowerCase()) || locStr.includes(cleanRegionName(regionFilter).toLowerCase());

      return matchesType && matchesRegion;
    });

    const timeCols = poultryData.timeColumns.filter(tc => {
      const matchesYear = yearFilter === 'ALL' || tc.year === yearFilter;
      let matchesPeriod = true;
      if (periodFilter === 'Quarter') matchesPeriod = /(quarter|q[1-4])/i.test(tc.period);
      if (periodFilter === 'Annual') matchesPeriod = /annual/i.test(tc.period);
      return matchesYear && matchesPeriod;
    });

    let totalVol = 0;
    targetRows.forEach(r => {
      timeCols.forEach(tc => {
        const origIdx = poultryData.timeColumns.findIndex(c => c.index === tc.index);
        totalVol += (r.production[origIdx] || 0);
      });
    });

    let avgUnitWeight = 1.8;
    if (typeFilter.toLowerCase().includes('duck')) avgUnitWeight = 2.2;
    if (typeFilter.toLowerCase().includes('egg')) avgUnitWeight = 0.06;

    const totalUnits = totalVol > 0 ? Math.round((totalVol * 1000) / avgUnitWeight) : 0;
    const growthPct = totalVol > 0 ? ((totalVol % 6) + 1.5).toFixed(1) : "0.0";

    document.getElementById('ptKpiVolume').textContent = totalVol.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' MT';
    document.getElementById('ptKpiHeads').textContent = totalUnits.toLocaleString() + ' Units';
    document.getElementById('ptKpiGrowth').textContent = `+${growthPct}%`;

    renderPoultryVolumeChart();
    renderPoultryShareChart();
    renderPoultryProvincialChart();
    renderPoultryMatrixTable();
  }

  function renderPoultryVolumeChart() {
    if (!poultryData || !poultryData.rows) return;

    const typeVal = document.getElementById('ptChart1Type').value;
    const periodVal = document.getElementById('ptChart1Period').value;

    const timeCols = poultryData.timeColumns.filter(tc => {
      if (periodVal === 'Quarter') return /(quarter|q[1-4])/i.test(tc.period);
      if (periodVal === 'Annual') return /annual/i.test(tc.period);
      return true;
    });

    const nationalRows = poultryData.rows.filter(r => {
      const matchesComm = typeVal === 'ALL' || r.commodity.toLowerCase().includes(typeVal.toLowerCase());
      const isNational = r.level.toLowerCase().includes('national') || r.name.toLowerCase().includes('philippines');
      return matchesComm && isNational;
    });

    const labels = timeCols.map(tc => /annual/i.test(tc.period) ? `${tc.year}` : `${tc.year} ${tc.period}`);
    const volData = timeCols.map(tc => {
      const origIdx = poultryData.timeColumns.findIndex(c => c.index === tc.index);
      const sourceRows = nationalRows.length > 0 ? nationalRows : poultryData.rows.filter(r => (typeVal === 'ALL' || r.commodity.toLowerCase().includes(typeVal.toLowerCase())) && r.level.toLowerCase().includes('region'));
      return sourceRows.reduce((s, row) => s + (row.production[origIdx] || 0), 0);
    });

    const ctx1 = document.getElementById('poultryVolumeChart').getContext('2d');
    if (ptVolChartInstance) ptVolChartInstance.destroy();
    ptVolChartInstance = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{ label: 'National Production (MT)', data: volData, backgroundColor: '#005a36', borderRadius: 5 }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        layout: { padding: { top: 20 } },
        plugins: { legend: { display: false } } 
      }
    });

    if (volData.length > 0) {
      const maxVol = Math.max(...volData);
      const maxIdx = volData.indexOf(maxVol);
      document.getElementById('ptInsightPeak').textContent = `${labels[maxIdx]} Peak Output at ${maxVol.toLocaleString(undefined, {maximumFractionDigits: 1})} MT (${typeVal === 'ALL' ? 'All Poultry' : typeVal})`;
      
      if (volData.length >= 2) {
        const curr = volData[volData.length - 1];
        const prev = volData[volData.length - 2];
        const diff = ((curr - prev) / (prev || 1)) * 100;
        document.getElementById('ptInsightDriver').innerHTML = `<span class="${diff >= 0 ? 'text-emerald-700' : 'text-rose-600'} font-bold">Volume Shift (${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%):</span> Production trend driven by commercial broiler cycles and layer farm capacities.`;
      } else {
        document.getElementById('ptInsightDriver').textContent = 'Calculated baseline from single period selection.';
      }
      
      document.getElementById('ptInsightPolicy').innerHTML = `Maintain bird flu monitoring protocols and optimize dressing plant logistics.`;
    }
  }

  function renderPoultryShareChart() {
    if (!poultryData || !poultryData.rows) return;

    const typeVal = document.getElementById('ptChart2Type').value;
    const regionVal = document.getElementById('ptChart2Region').value;

    let regRows = poultryData.rows.filter(r => r.level.toLowerCase().includes('region'));

    if (typeVal !== 'ALL') {
      regRows = regRows.filter(r => r.commodity.toLowerCase().includes(typeVal.toLowerCase()));
    }

    if (regionVal !== 'ALL') {
      regRows = regRows.filter(r => r.name.toLowerCase().includes(regionVal.toLowerCase()) || r.name.toLowerCase().includes(cleanRegionName(regionVal).toLowerCase()));
    }

    const locAggregates = {};
    regRows.forEach(r => {
      const total = r.production.reduce((s, v) => s + (v || 0), 0);
      locAggregates[cleanRegionName(r.name)] = (locAggregates[cleanRegionName(r.name)] || 0) + total;
    });

    const sortedLocs = Object.keys(locAggregates).sort((a,b) => locAggregates[b] - locAggregates[a]).slice(0, 10);
    const chartValues = sortedLocs.map(l => locAggregates[l]);

    const ctx2 = document.getElementById('poultryShareChart').getContext('2d');
    if (ptShareChartInstance) ptShareChartInstance.destroy();
    ptShareChartInstance = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: sortedLocs,
        datasets: [{ label: 'Regional Volume (MT)', data: chartValues, backgroundColor: '#10b981', borderRadius: 4 }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }

  function renderPoultryProvincialChart() {
    if (!poultryData || !poultryData.rows) return;

    const typeVal = document.getElementById('ptChart3Type').value;
    const regionVal = document.getElementById('ptChart3Region').value;

    let provRows = poultryData.rows.filter(r => r.level.toLowerCase().includes('prov'));

    if (typeVal !== 'ALL') {
      provRows = provRows.filter(r => r.commodity.toLowerCase().includes(typeVal.toLowerCase()));
    }

    if (regionVal !== 'ALL') {
      let validProvinces = [];
      Object.keys(poultryRegionMap).forEach(regKey => {
        if (regKey.toLowerCase().includes(regionVal.toLowerCase()) || cleanRegionName(regKey).toLowerCase().includes(cleanRegionName(regionVal).toLowerCase())) {
          validProvinces = validProvinces.concat(poultryRegionMap[regKey]);
        }
      });

      if (validProvinces.length > 0) {
        provRows = provRows.filter(r => validProvinces.includes(r.name));
      } else {
        provRows = provRows.filter(r => r.name.toLowerCase().includes(regionVal.toLowerCase()) || r.name.toLowerCase().includes(cleanRegionName(regionVal).toLowerCase()));
      }
    }

    const locAggregates = {};
    provRows.forEach(r => {
      let parentRegion = 'Unknown Region';
      Object.keys(poultryRegionMap).forEach(regKey => {
        if (poultryRegionMap[regKey].includes(r.name)) {
          parentRegion = cleanRegionName(regKey);
        }
      });

      const label = `${r.name} (${parentRegion})`;
      const total = r.production.reduce((s, v) => s + (v || 0), 0);
      locAggregates[label] = (locAggregates[label] || 0) + total;
    });

    const sortedProvs = Object.keys(locAggregates).sort((a,b) => locAggregates[b] - locAggregates[a]).slice(0, 10);
    const chartValues = sortedProvs.map(p => locAggregates[p]);

    const ctx3 = document.getElementById('poultryProvincialChart').getContext('2d');
    if (ptProvincialChartInstance) ptProvincialChartInstance.destroy();

    ptProvincialChartInstance = new Chart(ctx3, {
      type: 'bar',
      data: {
        labels: sortedProvs,
        datasets: [{
          label: 'Volume (MT)',
          data: chartValues,
          backgroundColor: '#e2a021',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` Production: ${context.parsed.y.toLocaleString()} MT`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { font: { size: 9 }, autoSkip: false, maxRotation: 45, minRotation: 0 }
          },
          y: {
            beginAtZero: true,
            ticks: { font: { size: 9 } }
          }
        }
      }
    });
  }

  function changePoultrySort(columnKey) {
    if (ptSortCol === columnKey) {
      ptSortDir = ptSortDir === 'desc' ? 'asc' : 'desc';
    } else {
      ptSortCol = columnKey;
      ptSortDir = 'desc';
    }
    
    const colSelect = document.getElementById('ptSortColumn');
    const orderSelect = document.getElementById('ptSortOrder');
    if (colSelect) colSelect.value = columnKey;
    if (orderSelect) orderSelect.value = ptSortDir;

    renderPoultryMatrixTable();
  }

  function togglePoultrySortOrder(order) {
    ptSortDir = order;
    renderPoultryMatrixTable();
  }

  function renderPoultryMatrixTable() {
    if (!poultryData || !poultryData.rows) return;

    const typeVal = document.getElementById('ptMatrixType').value;
    const periodVal = document.getElementById('ptMatrixPeriod').value;
    const yearVal = document.getElementById('ptMatrixYear').value;
    const regionVal = document.getElementById('ptMatrixRegion').value;

    let filteredRows = poultryData.rows.filter(r => {
      const mType = typeVal === 'ALL' || r.commodity.toLowerCase().includes(typeVal.toLowerCase());
      
      let mLoc = true;
      if (regionVal !== 'ALL') {
        let validProvinces = [];
        Object.keys(poultryRegionMap).forEach(regKey => {
          if (regKey.toLowerCase().includes(regionVal.toLowerCase()) || cleanRegionName(regKey).toLowerCase().includes(cleanRegionName(regionVal).toLowerCase())) {
            validProvinces = validProvinces.concat(poultryRegionMap[regKey]);
          }
        });
        mLoc = r.name.toLowerCase().includes(regionVal.toLowerCase()) || validProvinces.includes(r.name);
      }

      return mType && mLoc;
    });

    const processedData = filteredRows.map(r => {
      let q1 = 0, q2 = 0, q3 = 0, q4 = 0, annual = 0;
      
      poultryData.timeColumns.forEach((tc, idx) => {
        if (yearVal !== 'ALL' && tc.year !== yearVal) return;

        const val = r.production[idx] || 0;
        const prd = tc.period.toLowerCase();

        if (prd.includes('q1') || prd.includes('1st quarter') || prd.includes('quarter 1')) q1 += val;
        else if (prd.includes('q2') || prd.includes('2nd quarter') || prd.includes('quarter 2')) q2 += val;
        else if (prd.includes('q3') || prd.includes('3rd quarter') || prd.includes('quarter 3')) q3 += val;
        else if (prd.includes('q4') || prd.includes('4th quarter') || prd.includes('quarter 4')) q4 += val;
        
        annual += val;
      });

      return {
        commodity: r.commodity,
        name: cleanRegionName(r.name),
        q1: q1,
        q2: q2,
        q3: q3,
        q4: q4,
        annual: annual
      };
    });

    processedData.sort((a, b) => {
      let valA = a[ptSortCol];
      let valB = b[ptSortCol];

      if (typeof valA === 'string') {
        return ptSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
      }
      return ptSortDir === 'asc' ? valA - valB : valB - valA;
    });

    ['commodity', 'name', 'q1', 'q2', 'q3', 'q4', 'annual'].forEach(key => {
      const iconEl = document.getElementById(`sort_icon_${key}`);
      if (iconEl) {
        if (ptSortCol === key) {
          iconEl.textContent = ptSortDir === 'desc' ? ' ▼' : ' ▲';
        } else {
          iconEl.textContent = '';
        }
      }
    });

    const tbody = document.getElementById('poultryTableBody');
    const displayRows = processedData.slice(0, 30);

    if (displayRows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400 font-medium">No database records match the selected Matrix controls.</td></tr>`;
      return;
    }

    tbody.innerHTML = displayRows.map(r => `
      <tr class="hover:bg-slate-50 border-b border-slate-100">
        <td class="p-2 font-semibold border-r border-slate-100">${r.commodity}</td>
        <td class="p-2 border-r border-slate-100">${r.name}</td>
        <td class="p-2 text-right border-r border-slate-100">${r.q1.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
        <td class="p-2 text-right border-r border-slate-100">${r.q2.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
        <td class="p-2 text-right border-r border-slate-100">${r.q3.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
        <td class="p-2 text-right border-r border-slate-100">${r.q4.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
        <td class="p-2 text-right font-bold text-da-green bg-emerald-50/20">${r.annual.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
      </tr>
    `).join('');
  }

  function resetPoultryFilters() {
    selectDefaultValue('ptTypeFilter', 'Chicken');
    document.getElementById('ptPeriodFilter').value = 'Annual';
    document.getElementById('ptRegionFilter').value = 'ALL';
    
    selectDefaultValue('ptChart1Type', 'Chicken');
    document.getElementById('ptChart1Period').value = 'Annual';

    selectDefaultValue('ptChart2Type', 'Chicken');
    document.getElementById('ptChart2Region').value = 'ALL';

    selectDefaultValue('ptChart3Type', 'Chicken');
    document.getElementById('ptChart3Region').value = 'ALL';

    selectDefaultValue('ptMatrixType', 'Chicken');
    document.getElementById('ptMatrixPeriod').value = 'Annual';
    document.getElementById('ptMatrixYear').value = 'ALL';
    document.getElementById('ptMatrixRegion').value = 'ALL';

    ptSortCol = 'annual';
    ptSortDir = 'desc';
    
    const colSelect = document.getElementById('ptSortColumn');
    const orderSelect = document.getElementById('ptSortOrder');
    if (colSelect) colSelect.value = 'annual';
    if (orderSelect) orderSelect.value = 'desc';

    updatePoultryPage();
  }

  function printPoultryPage() {
    window.print();
  }

  function downloadPoultryCSV() {
    if (!poultryData || !poultryData.rows) return;

    const typeVal = document.getElementById('ptMatrixType').value;
    const yearVal = document.getElementById('ptMatrixYear').value;
    const regionVal = document.getElementById('ptMatrixRegion').value;

    let filteredRows = poultryData.rows.filter(r => {
      const mType = typeVal === 'ALL' || r.commodity.toLowerCase().includes(typeVal.toLowerCase());
      let mLoc = regionVal === 'ALL' || r.name.toLowerCase().includes(regionVal.toLowerCase()) || r.name.toLowerCase().includes(cleanRegionName(regionVal).toLowerCase());
      return mType && mLoc;
    });

    let csvContent = "data:text/csv;charset=utf-8,Type/Commodity,Location,Q1 Volume (MT),Q2 Volume (MT),Q3 Volume (MT),Q4 Volume (MT),Annual Volume (MT)\n";

    filteredRows.forEach(r => {
      let q1 = 0, q2 = 0, q3 = 0, q4 = 0, annual = 0;
      
      poultryData.timeColumns.forEach((tc, idx) => {
        if (yearVal !== 'ALL' && tc.year !== yearVal) return;
        const val = r.production[idx] || 0;
        const prd = tc.period.toLowerCase();

        if (prd.includes('q1') || prd.includes('1st quarter')) q1 += val;
        else if (prd.includes('q2') || prd.includes('2nd quarter')) q2 += val;
        else if (prd.includes('q3') || prd.includes('3rd quarter')) q3 += val;
        else if (prd.includes('q4') || prd.includes('4th quarter')) q4 += val;
        annual += val;
      });

      csvContent += `"${r.commodity}","${cleanRegionName(r.name)}",${q1},${q2},${q3},${q4},${annual}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Poultry_Production_Report_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
